[project]
name = "safespace-ai"
version = "0.1.0"
description = "Agentic AI mental-health support assistant built with LangGraph, FastAPI and Gradio"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "fastapi>=0.135.1",
    "gradio>=6.14.0",
    "langchain>=1.2.13",
    "langchain-ollama>=1.1.0",
    "langgraph>=1.1.3",
    "ollama>=0.6.1",
    "pydantic>=2.12.5",
    "python-dotenv>=1.2.2",
    "requests>=2.32.5",
    "streamlit>=1.55.0",
    "twilio>=9.10.3",
    "uvicorn>=0.42.0",
]

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "pytest>=8.4.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["backend", "."]
