name: CI

# Run on every push to main and on every pull request
on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      # 1. Get the code
      - uses: actions/checkout@v4

      # 2. Install uv (it also installs the Python version from .python-version)
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true

      # 3. Install exactly the pinned dependencies from uv.lock (incl. pytest)
      - name: Install dependencies
        run: uv sync --frozen

      # 4. Lint: unused code, undefined names, import order
      - name: Lint with ruff
        run: uv run ruff check .

      # 5. Security: static analysis (SAST) of our own code.
      #    Fails on any medium or high severity finding.
      - name: Security scan with bandit
        run: uvx bandit -r backend gradio_frontend.py evals -ll

      # 6. Security: check every locked dependency against known CVEs.
      - name: Dependency vulnerability scan with pip-audit
        run: |
          uv export --frozen --no-dev --no-emit-project --no-hashes -o requirements-audit.txt
          uvx pip-audit -r requirements-audit.txt --disable-pip --no-deps

      # 7. Run the tests. External services (Ollama, Twilio, APIs) are
      #    replaced with fakes in the tests, so no models or keys are needed.
      - name: Run tests
        run: uv run pytest -v

      # 8. Print the golden-dataset scores for the router (the regression
      #    gates themselves run inside pytest in tests/test_evals.py)
      - name: Evaluation report
        run: uv run python evals/run_eval.py
